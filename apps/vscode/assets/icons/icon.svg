    <title>OpenProvider</title>
    <!--
        VS Code renders activity bar icons as a single-colour mask, so this has to
        stay a flat vector path: an embedded raster image renders as a solid block.
        The mark is an open ring (the "O" with a gap) plus a diamond in that gap.
    -->
