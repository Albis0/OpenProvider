        fill="currentColor"
        d="M12 3.25c.62 0 1.22.06 1.8.19l-.71 2.63A6.25 6.25 0 1 0 17.93 11l2.63-.71c.13.58.19 1.18.19 1.8a8.75 8.75 0 1 1-8.75-8.84Z" />
    <path
        fill="currentColor"
        d="m17.4 4.4 2.83 2.83-2.83 2.83-2.83-2.83z" />
</svg>
